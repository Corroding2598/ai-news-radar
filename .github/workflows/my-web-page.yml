name: 🚀 专属网页定时生成

on:
  schedule:
    # 北京时间每天晚上 21:00 自动运行
    - cron: '0 13 * * *'
  workflow_dispatch: # 允许手动点击按钮测试

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取最新代码
        uses: actions/checkout@v3

      - name: ⚙️ 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: 🤖 抓取过去 24 小时数据
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21 || true

      - name: 📝 用 Python 生成“直观无折叠”极简网页
        run: |
          python - << 'EOF'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          # 1. 获取准确的北京时间日期
          tz_bj = timezone(timedelta(hours=8))
          report_date = datetime.now(timezone.utc).astimezone(tz_bj).strftime('%Y年%m月%d日')

          # 2. 读取数据
          items = []
          file_path = "data/daily-brief.json"
          if os.path.exists(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  try:
                      raw_data = json.load(f)
                      items = raw_data.get("items", []) if isinstance(raw_data, dict) else raw_data
                  except:
                      pass

          # 3. 拼接网页列表 HTML
          list_html = ""
          if not items:
              list_html = '<div class="empty">该报告期内暂无伯乐精选更新</div>'
          else:
              for idx, item in enumerate(items[:30]):
                  title = item.get("title", "无标题").replace("'", "\\'").replace('"', '\\"')
                  url = item.get("url", "#")
                  summary = item.get("summary", "")
                  if not summary and "sources" in item and item["sources"]:
                      summary = item["sources"][0].get("title", "")
                  if not summary:
                      summary = "暂无摘要描述"
                  summary = summary.replace("'", "\\'").replace('"', '\\"')
                  
                  # 一键直达的链接标签
                  link_html = f'<div class="card-action"><a href="{url}" target="_blank" class="news-link">🚀 访问原文查看正文 ↗</a></div>' if url != "#" else ""
                  
                  list_html += f'''
                  <article class="news-card">
                    <h2 class="news-title">{idx + 1}. {title}</h2>
                    <p class="news-summary">📝 <b>摘要提炼：</b>{summary}</p>
                    {link_html}
                  </article>
                  '''

          # 4. 完整的 HTML 模板
          html_content = f'''<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🤖 伯乐精选 · AI 每日雷达</title>
              <style>
                  :root {{ --bg: #f4f7f6; --card: #ffffff; --text: #333333; --primary: #2563eb; }}
                  body {{ font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }}
                  .container {{ max-width: 800px; margin: 0 auto; }}
                  header {{ text-align: center; margin-bottom: 30px; }}
                  h1 {{ color: #111827; margin-bottom: 5px; }}
                  .date-badge {{ display: inline-block; background: #e0f2fe; color: #0369a1; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; margin-top: 10px; }}
                  .update-time {{ color: #6b7280; font-size: 0.85rem; margin-top: 8px; }}
                  .news-list {{ display: flex; flex-direction: column; gap: 15px; }}
                  
                  /* 卡片主样式 */
                  .news-card {{ background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid #e5e7eb; }}
                  .news-title {{ font-size: 1.2rem; font-weight: bold; color: #1e293b; margin: 0 0 10px 0; line-height: 1.4; }}
                  .news-summary {{ color: #475569; font-size: 0.95rem; line-height: 1.6; margin: 0 0 15px 0; }}
                  
                  /* 直接展示的链接按钮 */
                  .card-action {{ border-top: 1px dashed #e5e7eb; padding-top: 12px; }}
                  .news-link {{ display: inline-block; color: var(--primary); text-decoration: none; font-weight: 500; font-size: 0.88rem; background: #eff6ff; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; }}
                  .news-link:hover {{ background: #2563eb; color: #ffffff; }}
                  .empty {{ text-align: center; color: #9ca3af; padding: 40px; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <header>
                      <h1>🤖 伯乐精选 · AI 每日雷达</h1>
                      <div class="date-badge">📅 当前报告期：{report_date}</div>
                      <p class="update-time">（系统于每天北京时间 21:00 自动抓取更新）</p>
                  </header>
                  <main class="news-list">
                      {list_html}
                  </main>
              </div>
          </body>
          </html>'''

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html_content)
          print("无折叠纯净HTML复写成功！")
          EOF

      - name: 🌐 将网页一键发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
