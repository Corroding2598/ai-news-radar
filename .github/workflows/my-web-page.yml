name: 🚀 专属网页定时生成

on:
  schedule:
    # 北京时间每天晚上 21:00 自动运行
    - cron: '0 13 * * *'
  workflow_dispatch: # 允许手动点击按钮测试

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取最新代码
        uses: actions/checkout@v3

      - name: ⚙️ 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: 🤖 抓取过去 24 小时数据
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21 || true

      - name: 📝 用 Python 生成“露摘要、折链接”网页
        run: |
          python - << 'EOF'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          # 1. 获取准确的北京时间日期
          tz_bj = timezone(timedelta(hours=8))
          report_date = datetime.now(timezone.utc).astimezone(tz_bj).strftime('%Y年%m月%d日')

          # 2. 读取数据
          items = []
          file_path = "data/daily-brief.json"
          if os.path.exists(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  try:
                      raw_data = json.load(f)
                      items = raw_data.get("items", []) if isinstance(raw_data, dict) else raw_data
                  except:
                      pass

          # 3. 拼接网页列表 HTML
          list_html = ""
          if not items:
              list_html = '<div class="empty">该报告期内暂无伯乐精选更新</div>'
          else:
              for idx, item in enumerate(items[:30]):
                  title = item.get("title", "无标题").replace("'", "\\'").replace('"', '\\"')
                  url = item.get("url", "#")
                  summary = item.get("summary", "")
                  if not summary and "sources" in item and item["sources"]:
                      summary = item["sources"][0].get("title", "")
                  if not summary:
                      summary = "暂无摘要描述"
                  summary = summary.replace("'", "\\'").replace('"', '\\"')
                  
                  card_id = f"card-{idx}"
                  
                  # 只有当有真实链接时才渲染折叠区域
                  if url != "#":
                      action_area = f'''
                      <div class="card-action">
                          <button class="toggle-btn" onclick="toggleCard('{card_id}')">🔗 展开原文查看 ➔</button>
                      </div>
                      <div class="card-content">
                          <div class="content-inner">
                              <a href="{url}" target="_blank" class="news-link">🚀 离开当前页，访问原始网站 ↗</a>
                          </div>
                      </div>
                      '''
                  else:
                      action_area = '<p class="no-link">📌 此条资讯暂无外部链接</p>'
                  
                  list_html += f'''
                  <article class="news-card" id="{card_id}">
                    <h2 class="news-title">{idx + 1}. {title}</h2>
                    <p class="news-summary">📝 <b>摘要：</b>{summary}</p>
                    {action_area}
                  </article>
                  '''

          # 4. 完整的 HTML 模板
          html_content = f'''<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🤖 伯乐精选 · AI 每日雷达</title>
              <style>
                  :root {{ --bg: #f4f7f6; --card: #ffffff; --text: #333333; --primary: #2563eb; }}
                  body {{ font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }}
                  .container {{ max-width: 800px; margin: 0 auto; }}
                  header {{ text-align: center; margin-bottom: 30px; }}
                  h1 {{ color: #111827; margin-bottom: 5px; }}
                  .date-badge {{ display: inline-block; background: #e0f2fe; color: #0369a1; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; margin-top: 10px; }}
                  .update-time {{ color: #6b7280; font-size: 0.85rem; margin-top: 8px; }}
                  .news-list {{ display: flex; flex-direction: column; gap: 15px; }}
                  
                  /* 卡片 */
                  .news-card {{ background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid #e5e7eb; }}
                  .news-title {{ font-size: 1.2rem; font-weight: bold; color: #1e293b; margin: 0 0 10px 0; line-height: 1.4; }}
                  .news-summary {{ color: #475569; font-size: 0.95rem; line-height: 1.6; margin: 0 0 15px 0; }}
                  
                  /* 按钮区域 */
                  .card-action {{ border-top: 1px solid #f1f5f9; padding-top: 12px; }}
                  .toggle-btn {{ background: #eff6ff; color: var(--primary); border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }}
                  .toggle-btn:hover {{ background: #dbeafe; }}
                  
                  /* 折叠动画 */
                  .card-content {{ max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out; }}
                  .content-inner {{ padding: 10px 0 0 0; }}
                  .news-link {{ display: inline-block; color: #ffffff; text-decoration: none; font-weight: 500; font-size: 0.9rem; background: var(--primary); padding: 8px 14px; border-radius: 6px; box-shadow: 0 2px 4px rgba(37,99,235,0.2); }}
                  .news-link:hover {{ background: #1d4ed8; }}
                  
                  .no-link {{ color: #9ca3af; font-size: 0.85rem; margin: 0; padding-top: 10px; border-top: 1px solid #f1f5f9; }}
                  .empty {{ text-align: center; color: #9ca3af; padding: 40px; }}
                  
                  /* 展开状态 */
                  .news-card.active .card-content {{ max-height: 100px; }}
                  .news-card.active .toggle-btn {{ background: #f1f5f9; color: #64748b; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <header>
                      <h1>🤖 伯乐精选 · AI 每日雷达</h1>
                      <div class="date-badge">📅 当前报告期：{report_date}</div>
                      <p class="update-time">（系统于每天北京时间 21:00 自动抓取更新）</p>
                  </header>
                  <main class="news-list">
                      {list_html}
                  </main>
              </div>
              <script>
                  function toggleCard(cardId) {{
                      const card = document.getElementById(cardId);
                      const btn = card.querySelector('.toggle-btn');
                      const isExpanded = card.classList.contains('active');
                      if (isExpanded) {{
                          card.classList.remove('active');
                          btn.innerText = '🔗 展开原文查看 ➔';
                      }} else {{
                          card.classList.add('active');
                          btn.innerText = '✖ 收起原文链接';
                      }}
                  }}
              </script>
          </body>
          </html>'''

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html_content)
          print("新结构HTML复写成功！")
          EOF

      - name: 🌐 将网页一键发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
