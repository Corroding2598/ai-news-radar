name: 🚀 专属网页定时生成

on:
  schedule:
    # 北京时间每天晚上 21:00 自动运行
    - cron: '0 13 * * *'
  workflow_dispatch: # 允许手动点击按钮测试

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取最新代码
        uses: actions/checkout@v3

      - name: ⚙️ 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install requests || true

      - name: 🤖 抓取过去 24 小时数据
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21 || true

      - name: 🧠 混元大模型理科生级硬核长文本提炼
        env:
          HUNYUAN_KEY: ${{ secrets.HUNYUAN_API_KEY }}
        run: |
          python - << 'EOF'
          import json
          import os
          import requests
          import html
          from datetime import datetime, timedelta, timezone

          # 1. 获取北京时间日期
          tz_bj = timezone(timedelta(hours=8))
          report_date = datetime.now(timezone.utc).astimezone(tz_bj).strftime('%Y年%m月%d日')

          # 2. 读取数据
          items = []
          file_path = "data/daily-brief.json"
          if os.path.exists(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  try:
                      raw_data = json.load(f)
                      items = raw_data.get("items", []) if isinstance(raw_data, dict) else raw_data
                  except:
                      pass

          api_key = os.environ.get("HUNYUAN_KEY", "")

          def ai_refine(title, raw_summary):
              if not api_key:
                  return "未检测到有效的 API Key，无法使用 AI 提炼功能。"
              
              url = "https://api.hunyuan.cloud.tencent.com/v1/chat/completions"
              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              }
              
              # 极其严格的硬核理科生提示词
              prompt = f"""
              请对以下科技新闻进行降维翻译与深度硬核提炼：
              【新闻标题】：{title}
              【原始零散数据】：{raw_summary}

              【提炼硬性指标】：
              1. 核心受众为『理科大学生』。禁止口水话和简单的复读标题！必须层层剥离技术表象，讲清楚这项科技成果的“核心原理”、“应用场景”或“技术突破点是什么”。
              2. 整体内容篇幅必须充实，严格控制在 150 到 200 字之间（绝不能是一句话糊弄）。
              3. 严厉拒绝死板直译与生硬黑话。如果出现专业术语（如Prompt、Agent、Fine-tuning等），必须用通俗易懂的中文进行地道翻译并融入句意解释（例如：Prompt 翻译并解释为提示词指令）。
              4. 逻辑必须严密、客观理智，不要夹杂任何感情色彩。直接输出最终的摘要正文。
              """
              
              data = {
                  "model": "hunyuan-standard",
                  "messages": [
                      {"role": "user", "content": prompt}
                  ],
                  "temperature": 0.3 # 降低随机性，让大模型更理智听话
              }
              
              try:
                  res = requests.post(url, headers=headers, json=data, timeout=45)
                  res_json = res.json()
                  refined = res_json['choices'][0]['message']['content'].strip()
                  return refined
              except Exception as e:
                  return f"AI提炼遇到技术障碍: {str(e)}"

          # 3. 循环加工并用 Python 直接拼接安全的 HTML（不再交给前端 JS 渲染，从根源上抹除转义报错）
          list_html = ""
          if not items:
              list_html = '<div class="empty">该报告期内暂无伯乐精选更新</div>'
          else:
              print(f"开始调用混元大模型加工提炼前 {min(len(items), 30)} 条深度资讯...")
              for idx, item in enumerate(items[:30]):
                  orig_title = item.get("title", "无标题")
                  orig_url = item.get("url", "#")
                  
                  orig_summary = item.get("summary", "")
                  if not orig_summary and "sources" in item and item["sources"]:
                      orig_summary = item["sources"][0].get("title", "")
                  
                  # 获取大模型重写后的长摘要
                  ai_summary = ai_refine(orig_title, orig_summary)
                  
                  # 使用安全规避技术：将所有文本转换为安全的 HTML 实体编码，彻底杜绝任何引号引起的 JavaScript 报错！
                  safe_title = html.escape(orig_title)
                  safe_summary = html.escape(ai_summary)
                  
                  link_html = f'<div class="card-action"><a href="{orig_url}" target="_blank" class="news-link">🚀 访问原文查看正文 ↗</a></div>' if orig_url != "#" else ""
                  
                  list_html += f'''
                  <article class="news-card">
                    <h2 class="news-title">{idx + 1}. {safe_title}</h2>
                    <p class="news-summary">📝 {safe_summary}</p>
                    {link_html}
                  </article>
                  '''

          # 4. 生成清爽、无混元废话字眼的最终网页
          html_content = f'''<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🤖 伯乐精选 · AI 每日雷达</title>
              <style>
                  :root {{ --bg: #f4f7f6; --card: #ffffff; --text: #333333; --primary: #2563eb; }}
                  body {{ font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }}
                  .container {{ max-width: 800px; margin: 0 auto; }}
                  header {{ text-align: center; margin-bottom: 30px; }}
                  h1 {{ color: #111827; margin-bottom: 5px; }}
                  .date-badge {{ display: inline-block; background: #e0f2fe; color: #0369a1; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; margin-top: 10px; }}
                  .news-list {{ display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }}
                  .news-card {{ background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid #e5e7eb; }}
                  .news-title {{ font-size: 1.2rem; font-weight: bold; color: #1e293b; margin: 0 0 12px 0; line-height: 1.4; }}
                  .news-summary {{ color: #475569; font-size: 0.98rem; line-height: 1.7; margin: 0 0 15px 0; text-align: justify; white-space: pre-wrap; }}
                  .card-action {{ border-top: 1px dashed #e5e7eb; padding-top: 12px; }}
                  .news-link {{ display: inline-block; color: var(--primary); text-decoration: none; font-weight: 500; font-size: 0.88rem; background: #eff6ff; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; }}
                  .news-link:hover {{ background: #2563eb; color: #ffffff; }}
                  .empty {{ text-align: center; color: #9ca3af; padding: 40px; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <header>
                      <h1>🤖 伯乐精选 · AI 每日雷达</h1>
                      <div class="date-badge">📅 当前报告期：{report_date}</div>
                  </header>
                  <main class="news-list">
                      {list_html}
                  </main>
              </div>
          </body>
          </html>'''

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html_content)
          print("理科生深度精炼大模型网页构建成功！")
          EOF

      - name: 🌐 将网页一键发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
